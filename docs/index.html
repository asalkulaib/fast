<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fast">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Eating window and satiety tracker.">
<title>Fast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/strip-hash.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <main id="view" class="screen" aria-busy="true">
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-title"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-block"></div>
    <div class="skeleton sk-line"></div>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <button class="tab" type="button" data-tab="today">Today</button>
    <button class="tab" type="button" data-tab="week">Week</button>
    <button class="tab" type="button" data-tab="weight">Weight</button>
    <button class="tab" type="button" data-tab="more">More</button>
  </nav>
  <div id="sheet-root" class="sheet-root" hidden></div>
</div>
</body>
</html>
